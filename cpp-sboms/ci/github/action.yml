#       DT_API_KEY: ${{ secrets.DT_API_KEY }}
name: SBOM release gate
description: Build-derived TR-03183-2 SBOM, gated with sbomqs and a coverage check, signed with SignPath on releases
inputs:
  kind:
    description: cmake or firmware
    required: true
  args:
    description: arguments for sbom-release.sh after the kind
    required: true
  sign:
    description: "true to sign (release builds on a runner with the SignPath Cryptoki provider)"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Generate, gate, sign and publish the SBOM
      shell: bash
      env:
        SBOM_KIND: ${{ inputs.kind }}
        SBOM_ARGS: ${{ inputs.args }}
        SIGN_SBOM: ${{ inputs.sign }}
        SBOM_TOOLING: ${{ github.action_path }}/..
      run: |
        set -euo pipefail
        read -r -a args <<< "$SBOM_ARGS"
        bash "$SBOM_TOOLING/sbom-release.sh" "$SBOM_KIND" "${args[@]}"
